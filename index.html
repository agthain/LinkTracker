<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Discourage search engine indexing -->
  <meta name="robots" content="noindex, nofollow">
  <title>My Link Repository</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 id="site-title">Loading...</h1>
    <p id="site-description"></p>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Filter links...">
    </div>
  </header>

  <nav id="section-nav" class="section-nav"></nav>

  <main id="content">
    <!-- Sections are injected here by script.js -->
  </main>

  <footer class="site-footer">
    <p>Last updated automatically from <code>links.json</code></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
